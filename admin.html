<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>员工管理 · Tax Return Tracker</title>
<style>body{font:15px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;color:#193b39;background:#f3f7f4;margin:24px}main{max-width:950px;margin:auto}section{background:white;padding:22px;margin:20px 0;border:1px solid #dce7e3;border-radius:10px}input,select,button{font:inherit;padding:9px;margin:5px;border:1px solid #abc3b7;border-radius:6px}label{display:block}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}#message{color:#9b4324}pre{max-height:350px;overflow:auto;white-space:pre-wrap}button{cursor:pointer}a{color:#157565}</style>
<main><a href="/">← 返回工作台</a><h1>员工与服务器管理</h1><p>管理员可管理全部员工和备份；编辑员工可处理全部客户；只读员工可查看全部客户及下载导出。</p>
<section><h2>员工账号</h2><table><thead><tr><th>账号</th><th>权限</th><th>状态</th><th>操作</th></tr></thead><tbody id="users"></tbody></table>
<h3>新建 / 修改员工</h3><form id="user-form"><label>账号（英文、数字、点、下划线或短横线）<input name="username" required minlength="2" maxlength="64" autocomplete="off"></label>
<label>权限<select name="role"><option value="editor">编辑员工</option><option value="viewer">只读员工</option><option value="admin">管理员</option></select></label>
<label>新密码（至少 12 字符；修改现有员工时留空保留原密码）<input name="password" type="password" autocomplete="new-password" maxlength="256"></label>
<label><input name="active" type="checkbox" checked> 启用账号</label><button>保存员工</button></form><p>修改账号后，该员工的所有已登录会话立即失效。必须保留至少一名启用的管理员。</p></section>
<section><h2>服务器备份</h2><p>备份保存到服务器资料目录的 backups 文件夹，包含全部客户资料、员工密码哈希和操作记录。识别任务进行中需等待完成。</p><button id="backup">在服务器生成备份</button></section>
<section><h2>最近操作记录</h2><button id="reload">刷新记录</button><pre id="events"></pre></section><p id="message" role="status"></p></main>
<script>
const token='__LOCAL_TOKEN__',q=s=>document.querySelector(s),roles={admin:'管理员',editor:'编辑员工',viewer:'只读员工'};
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'X-Local-Token':token,'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});if(r.status===401){location.replace('/login');throw Error('请重新登录')}const x=await r.json();if(!r.ok)throw Error(x.error);return x}
async function load(){const users=await api('/api/users');q('#users').replaceChildren();for(const u of users){const tr=document.createElement('tr');for(const text of [u.username,roles[u.role],u.active?'启用':'停用']){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent='编辑';b.onclick=()=>{const f=q('#user-form');f.elements.username.value=u.username;f.elements.role.value=u.role;f.elements.password.value='';f.elements.active.checked=!!u.active;f.scrollIntoView()};td.append(b);tr.append(td);q('#users').append(tr)}await events()}
async function events(){const rows=await api('/api/server-events');q('#events').textContent=rows.map(x=>`${new Date(x.created*1000).toLocaleString()} · ${x.username} · ${x.action} · ${x.target}`).join('\n')}
q('#user-form').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await api('/api/users',{username:f.elements.username.value,role:f.elements.role.value,password:f.elements.password.value,active:f.elements.active.checked});f.elements.password.value='';q('#message').textContent='已保存；此员工需重新登录。';await load()}catch(x){q('#message').textContent=x.message}};
q('#backup').onclick=async()=>{q('#backup').disabled=true;try{const x=await api('/api/server-backup',{});q('#message').textContent='备份已保存在服务器：'+x.filename;await events()}catch(x){q('#message').textContent=x.message}finally{q('#backup').disabled=false}};q('#reload').onclick=()=>events().catch(x=>q('#message').textContent=x.message);load().catch(x=>q('#message').textContent=x.message);
</script></html>
